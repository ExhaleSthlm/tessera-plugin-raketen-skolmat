name: Hämta matsedel
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/scrape.py, .github/workflows/menu.yml]
permissions:
  contents: write
concurrency:
  group: menu
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/scrape.py
      - name: Spara ändrad matsedel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/menu.json
          if ! git diff --cached --quiet; then
            git commit -m 'Uppdatera matsedel'
            git push
          fi
